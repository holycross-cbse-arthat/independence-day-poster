<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Independence Day Poster Generator</title>
  <!-- Google Fonts: Poppins & Anek Malayalam -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@500;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', 'Anek Malayalam', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    /* Top Canvas Preview Area */
    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
    }

    canvas {
      max-width: 100%;
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      background-color: #ffffff;
      touch-action: none; /* Prevents page scrolling while gesturing on the canvas */
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .hint-text {
      font-size: 0.78rem;
      font-weight: 500;
      color: #64748b;
      text-align: center;
    }

    /* Form Card */
    .card {
      background: #ffffff;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #ea580c;
      background: #ffffff;
    }

    /* Download Button */
    .btn-download {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      width: 100%;
      margin-top: 4px;
    }

    .btn-download:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. POSTER CANVAS (Direct Touch Area) -->
  <div class="preview-container">
    <canvas id="posterCanvas" width="1080" height="1080"></canvas>
    <span class="hint-text">👆 1 finger to drag • 2 fingers to pinch-zoom & rotate</span>
  </div>

  <!-- 2. INPUTS & DOWNLOAD -->
  <div class="card">
    <div class="form-group">
      <label for="photoInput">1. Upload Photo (ഫോട്ടോ ചേർക്കുക)</label>
      <input type="file" id="photoInput" accept="image/*">
    </div>

    <div class="form-group">
      <label for="nameInput">2. Student / Teacher Name (പേര്)</label>
      <input type="text" id="nameInput" placeholder="Enter Full Name" value="John Doe">
    </div>

    <div class="form-group">
      <label for="schoolInput">3. School Name (സ്കൂൾ)</label>
      <input type="text" id="schoolInput" placeholder="Enter Class & School" value="Holy Cross CBSE School, Arthat">
    </div>

    <button class="btn-download" id="downloadBtn">Download Poster (HD)</button>
  </div>

</div>

<script>
  /**
   * Independence Day Instagram Poster Generator (1080x1080)
   * With Native Touch Gestures (Pinch-to-Zoom, Two-Finger Rotate, Pan)
   */

  const CANVAS_SIZE = 1080;
  const canvas = document.getElementById('posterCanvas');
  const ctx = canvas.getContext('2d');

  // Form Elements
  const photoInput = document.getElementById('photoInput');
  const nameInput = document.getElementById('nameInput');
  const schoolInput = document.getElementById('schoolInput');
  const downloadBtn = document.getElementById('downloadBtn');

  // Poster State
  let templateImage = new Image();
  let userPhoto = null;
  let isTemplateLoaded = false;

  // Photo Transform State (Controlled directly via gestures)
  let transform = {
    zoom: 1.0,
    rotateRad: 0,
    panX: 0,
    panY: 0
  };

  // Load Template Image
  templateImage.src = 'template.png';
  templateImage.onload = () => {
    isTemplateLoaded = true;
    renderPoster();
  };
  templateImage.onerror = () => {
    isTemplateLoaded = false;
    renderPoster();
  };

  // --- RENDERING ENGINE ---
  function renderPoster() {
    canvas.width = CANVAS_SIZE;
    canvas.height = CANVAS_SIZE;

    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    // 1. Base Template
    if (isTemplateLoaded && templateImage.naturalWidth !== 0) {
      ctx.drawImage(templateImage, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
    } else {
      const bgGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_SIZE);
      bgGrad.addColorStop(0, '#fde047');
      bgGrad.addColorStop(1, '#ea580c');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    }

    // 2. Photo Circular Area Coordinates
    const circleX = 860;
    const circleY = 400;
    const radius = 170;

    // Draw user photo with active transform state
    ctx.save();
    ctx.beginPath();
    ctx.arc(circleX, circleY, radius, 0, Math.PI * 2);
    ctx.clip();

    if (userPhoto) {
      ctx.translate(circleX, circleY);
      ctx.rotate(transform.rotateRad);
      ctx.translate(transform.panX, transform.panY);

      const baseScale = Math.max((radius * 2) / userPhoto.width, (radius * 2) / userPhoto.height);
      const scale = baseScale * transform.zoom;
      const drawW = userPhoto.width * scale;
      const drawH = userPhoto.height * scale;

      ctx.drawImage(userPhoto, -drawW / 2, -drawH / 2, drawW, drawH);
    } else {
      // Default Avatar Silhouette
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(circleX - radius, circleY - radius, radius * 2, radius * 2);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(circleX, circleY - 25, 50, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(circleX, circleY + 120, 95, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 3. Info Card Box
    const boxX = 660;
    const boxY = 600;
    const boxW = 400;
    const boxH = 95;
    const boxR = 14;

    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#ffffff';

    ctx.beginPath();
    ctx.moveTo(boxX + boxR, boxY);
    ctx.lineTo(boxX + boxW - boxR, boxY);
    ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + boxR);
    ctx.lineTo(boxX + boxW, boxY + boxH - boxR);
    ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - boxR, boxY + boxH);
    ctx.lineTo(boxX + boxR, boxY + boxH);
    ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - boxR);
    ctx.lineTo(boxX, boxY + boxR);
    ctx.quadraticCurveTo(boxX, boxY, boxX + boxR, boxY);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Typography
    ctx.textAlign = 'center';
    const textCenterX = boxX + (boxW / 2);

    // Student Name
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 28px "Poppins", "Anek Malayalam", sans-serif';
    ctx.fillText(nameInput.value.trim() || 'Student Name', textCenterX, boxY + 40);

    // Class / School Name
    ctx.fillStyle = '#047857';
    ctx.font = '600 20px "Poppins", "Anek Malayalam", sans-serif';
    ctx.fillText(schoolInput.value.trim() || 'Holy Cross CBSE School', textCenterX, boxY + 75);
  }

  // --- PHOTO UPLOAD ---
  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        userPhoto = new Image();
        userPhoto.onload = () => {
          // Reset gestures on new photo
          transform = { zoom: 1.0, rotateRad: 0, panX: 0, panY: 0 };
          renderPoster();
        };
        userPhoto.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  // Text changes live update
  nameInput.addEventListener('input', renderPoster);
  schoolInput.addEventListener('input', renderPoster);

  if (document.fonts) {
    document.fonts.ready.then(renderPoster);
  }

  // Download Trigger
  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `${nameInput.value.trim() || 'student'}-independence-day.png`;
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
  });

  // ==========================================
  // --- TOUCH GESTURE ENGINE (PINCH/ROTATE/PAN) ---
  // ==========================================
  let isDragging = false;
  let lastTouchX = 0;
  let lastTouchY = 0;
  let initialPinchDist = null;
  let initialPinchAngle = null;
  let startZoom = 1.0;
  let startRotate = 0;

  function getTouchDistance(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
  }

  function getTouchAngle(t1, t2) {
    return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
  }

  // Canvas Display Scale Factor (Canvas Pixel vs Screen Pixel)
  function getCanvasScale() {
    const rect = canvas.getBoundingClientRect();
    return CANVAS_SIZE / rect.width;
  }

  canvas.addEventListener('touchstart', (e) => {
    if (!userPhoto) return;
    if (e.touches.length === 1) {
      isDragging = true;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      isDragging = false;
      initialPinchDist = getTouchDistance(e.touches[0], e.touches[1]);
      initialPinchAngle = getTouchAngle(e.touches[0], e.touches[1]);
      startZoom = transform.zoom;
      startRotate = transform.rotateRad;
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (!userPhoto) return;

    if (e.touches.length === 1 && isDragging) {
      const scale = getCanvasScale();
      const dx = (e.touches[0].clientX - lastTouchX) * scale;
      const dy = (e.touches[0].clientY - lastTouchY) * scale;

      // Project pan movement relative to current rotation
      const cos = Math.cos(-transform.rotateRad);
      const sin = Math.sin(-transform.rotateRad);
      transform.panX += (dx * cos - dy * sin) / transform.zoom;
      transform.panY += (dx * sin + dy * cos) / transform.zoom;

      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
      renderPoster();
      e.preventDefault();
    } else if (e.touches.length === 2 && initialPinchDist) {
      // 1. Handle Pinch-to-Zoom
      const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
      const scaleFactor = currentDist / initialPinchDist;
      transform.zoom = Math.max(0.4, Math.min(3.5, startZoom * scaleFactor));

      // 2. Handle Two-Finger Rotation
      const currentAngle = getTouchAngle(e.touches[0], e.touches[1]);
      transform.rotateRad = startRotate + (currentAngle - initialPinchAngle);

      renderPoster();
      e.preventDefault();
    }
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      isDragging = false;
      initialPinchDist = null;
      initialPinchAngle = null;
    } else if (e.touches.length === 1) {
      // Transition from 2 fingers back to 1
      isDragging = true;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
      initialPinchDist = null;
      initialPinchAngle = null;
    }
  });

  // --- DESKTOP MOUSE SUPPORT (DRAG & SCROLL-ZOOM) ---
  let isMouseDown = false;
  let lastMouseX = 0;
  let lastMouseY = 0;

  canvas.addEventListener('mousedown', (e) => {
    if (!userPhoto) return;
    isMouseDown = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isMouseDown || !userPhoto) return;
    const scale = getCanvasScale();
    const dx = (e.clientX - lastMouseX) * scale;
    const dy = (e.clientY - lastMouseY) * scale;

    const cos = Math.cos(-transform.rotateRad);
    const sin = Math.sin(-transform.rotateRad);
    transform.panX += (dx * cos - dy * sin) / transform.zoom;
    transform.panY += (dx * sin + dy * cos) / transform.zoom;

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    renderPoster();
  });

  window.addEventListener('mouseup', () => { isMouseDown = false; });

  canvas.addEventListener('wheel', (e) => {
    if (!userPhoto) return;
    e.preventDefault();
    const zoomDelta = e.deltaY < 0 ? 0.08 : -0.08;
    transform.zoom = Math.max(0.4, Math.min(3.5, transform.zoom + zoomDelta));
    renderPoster();
  }, { passive: false });

  // Initial draw
  renderPoster();
</script>
</body>
</html>
